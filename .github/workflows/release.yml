name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate translation table
        shell: pwsh
        run: |
          $z = Get-Content src/zht.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $n = @($z.PSObject.Properties).Count
          Write-Host "strings: $n"
          if ($n -lt 400) { throw "translation table looks truncated ($n strings)" }
          $empty = @()
          foreach ($p in $z.PSObject.Properties) {
            if (([string]$p.Value).Trim().Length -eq 0) { $empty += $p.Name }
          }
          if ($empty.Count -gt 0) { throw ("empty translations: " + ($empty -join ", ")) }

      - name: Build zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev" }
          $out = "Trafficity-CHT-$tag.zip"
          Compress-Archive -Path src/* -DestinationPath $out -Force
          Get-Item $out | Format-List Name, Length
          "ZIP=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trafficity-CHT
          path: Trafficity-CHT-*.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Trafficity-CHT-*.zip
          generate_release_notes: true
          body: |
            ## Trafficity 繁體中文（台灣）漢化

            解壓後雙擊 安裝繁體中文.bat（SmartScreen 警告請選「更多資訊 → 仍要執行」）。
            進遊戲：設定 → 語言 → 繁體中文。

            還原：執行 還原原版.bat。
            遊戲更新後請重新執行安裝腳本。
