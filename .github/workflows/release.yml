name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate translation table
        shell: pwsh
        run: |
          $z = Get-Content src/zht.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $n = @($z.PSObject.Properties).Count
          Write-Host "strings: $n"
          if ($n -lt 400) { throw "translation table looks truncated ($n strings)" }
          $empty = @()
          foreach ($p in $z.PSObject.Properties) {
            if (([string]$p.Value).Trim().Length -eq 0) { $empty += $p.Name }
          }
          if ($empty.Count -gt 0) { throw ("empty translations: " + ($empty -join ", ")) }

      - name: Validate patcher anchors
        shell: pwsh
        run: |
          $ps = Get-Content src/patch.ps1 -Raw -Encoding UTF8
          foreach ($a in @('zhs:{', 'schinese:"zhs"', 'zhs:"zh-CN"')) {
            if (-not $ps.Contains($a)) { throw "anchor missing in patch.ps1: $a" }
          }
          $cs = Get-Content src/installer/Installer.cs -Raw -Encoding UTF8
          foreach ($r in @('patch.ps1', 'restore.ps1', 'zht.json')) {
            if (-not $cs.Contains($r)) { throw "installer does not reference $r" }
          }
          Write-Host "anchors present"

      - name: Build portable zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "dev" }
          $out = "Trafficity-CHT-$tag.zip"
          Compress-Archive -Path src/patch.ps1, src/restore.ps1, src/zht.json, src/安裝繁體中文.bat, src/還原原版.bat -DestinationPath $out -Force
          Get-Item $out | Format-List Name, Length

      - name: Build installer exe
        shell: pwsh
        run: pwsh -NoProfile -File src/installer/build.ps1

      - name: Smoke test installer
        shell: pwsh
        run: |
          $exe = "dist/Trafficity-CHT-Setup.exe"
          if (-not (Test-Path $exe)) { throw "installer not built" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 20000) { throw "installer suspiciously small: $($bytes.Length)" }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "not a PE executable" }
          Write-Host ("installer: {0} bytes" -f $bytes.Length)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Trafficity-CHT
          path: |
            Trafficity-CHT-*.zip
            dist/Trafficity-CHT-Setup.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Trafficity-CHT-*.zip
            dist/Trafficity-CHT-Setup.exe
          generate_release_notes: true
          body: |
            ## Trafficity 繁體中文（台灣）漢化

            兩種安裝方式，選一種：

            **一鍵安裝（推薦）**：下載 `Trafficity-CHT-Setup.exe`，關閉遊戲後雙擊。
            程式會自動尋找遊戲、備份原檔、安裝繁中語系，並把語言設為繁體中文。

            **可攜包**：下載 `Trafficity-CHT-*.zip` 解壓，雙擊 `安裝繁體中文.bat`。

            進遊戲：設定 → 語言 → 繁體中文。
            還原：`Trafficity-CHT-Setup.exe --restore` 或執行 `還原原版.bat`。

            遊戲更新後請重新執行安裝。
